name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    # GTK 4.20 and libadwaita 1.8 or newer, which Ubuntu's own images do not have.
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install the build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git-core rust cargo rustfmt clippy just blueprint-compiler
          gtk4-devel libadwaita-devel gtksourceview5-devel glib2-devel
          desktop-file-utils appstream gettext
      - uses: actions/checkout@v5
      - name: Lint
        run: just check
      - name: Test
        run: just test

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
