[package]
name = "blink"
version = "0.7.0"
edition = "2024"
rust-version = "1.95"
authors = ["sachesi <xsachesi@pm.me>"]
description = "A Markdown editor with a live preview, for GNOME"
license = "GPL-3.0-or-later"
repository = "https://github.com/sachesi/blink"
homepage = "https://github.com/sachesi/blink"
readme = "README.md"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
sourceview5 = "0.11"
pulldown-cmark = "0.13"
emojis = "0.9"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
pangocairo = "0.22"
cairo-rs = { version = "0.22", features = ["pdf", "v1_16"] }
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-types = "0.1.14"
ratex-font = "0.1.14"
ratex-katex-fonts = "0.1.14"
ab_glyph = "0.2"

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Keep overflow checks in release: the markdown list-counter / nesting-depth
# arithmetic must trap rather than wrap on pathological input.
overflow-checks = true
